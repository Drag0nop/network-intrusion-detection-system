<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS - Network Intrusion Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input:focus + label {
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-card.safe {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .result-card.threat {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .result-card h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .confidence {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 10px;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ NIDS</h1>
        <p class="subtitle">Network Intrusion Detection System</p>
        
        <form id="nidsForm" method="POST">
            <div class="form-grid">
                <div class="input-group">
                    <label for="f1">Duration</label>
                    <input type="text" id="f1" name="f1" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label for="f2">Protocol</label>
                    <input type="text" id="f2" name="f2" placeholder="tcp" required>
                </div>
                <div class="input-group">
                    <label for="f3">Service</label>
                    <input type="text" id="f3" name="f3" placeholder="http" required>
                </div>
                <div class="input-group">
                    <label for="f4">Flag</label>
                    <input type="text" id="f4" name="f4" placeholder="SF" required>
                </div>
                <div class="input-group">
                    <label for="f5">Src Bytes</label>
                    <input type="text" id="f5" name="f5" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label for="f6">Dst Bytes</label>
                    <input type="text" id="f6" name="f6" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label for="f7">Count</label>
                    <input type="text" id="f7" name="f7" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label for="f8">Srv Count</label>
                    <input type="text" id="f8" name="f8" placeholder="0" required>
                </div>
                <div class="input-group">
                    <label for="f9">Same Srv Rate</label>
                    <input type="text" id="f9" name="f9" placeholder="0.0" required>
                </div>
                <div class="input-group">
                    <label for="f10">Diff Srv Rate</label>
                    <input type="text" id="f10" name="f10" placeholder="0.0" required>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Analyze Network Traffic</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea; font-weight: 600;">Analyzing...</p>
        </div>

        <div class="result-card" id="resultCard">
            <div class="icon" id="resultIcon"></div>
            <h2 id="prediction"></h2>
            <p class="confidence">Confidence: <span id="confidence"></span></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('nidsForm');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const predictionEl = document.getElementById('prediction');
        const confidenceEl = document.getElementById('confidence');
        const resultIcon = document.getElementById('resultIcon');

        form.addEventListener('submit', function(e) {
            // If you want to add client-side validation or animations
            loading.style.display = 'block';
            resultCard.style.display = 'none';
            
            // For demo purposes only - remove this if using real backend
            e.preventDefault();
            
            setTimeout(() => {
                const isThreat = Math.random() > 0.5;
                const confidence = Math.floor(Math.random() * 20 + 80);
                
                loading.style.display = 'none';
                resultCard.style.display = 'block';
                
                if (isThreat) {
                    resultCard.className = 'result-card threat';
                    resultIcon.textContent = '⚠️';
                    predictionEl.textContent = 'Threat Detected';
                } else {
                    resultCard.className = 'result-card safe';
                    resultIcon.textContent = '✅';
                    predictionEl.textContent = 'Normal Traffic';
                }
                
                confidenceEl.textContent = confidence + '%';
            }, 1500);
        });

        // Add input validation and formatting
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('label').style.color = '#667eea';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.querySelector('label').style.color = '#555';
            });
        });
    </script>
</body>
</html>
